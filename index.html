function hash(s){let n=2166136261;for(let c of s)n=Math.imul(n^c.charCodeAt(0),16777619);return n>>>0}
function generateSigil(){const t=field('sigil_text')||'I direct my will with clarity';const canvas=document.getElementById('sigil_canvas'),ctx=canvas.getContext('2d');const w=canvas.width=900,h=canvas.height=900,x=w/2,y=h/2;let seed=hash(t);function r(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}ctx.fillStyle='#0b0d13';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#cba46b';ctx.lineWidth=3;for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x,y,335-j*37,0,Math.PI*2);ctx.stroke()}for(let i=0;i<13;i++){const a=r()*Math.PI*2,b=r()*Math.PI*2,ra=65+r()*230,rb=65+r()*230;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*ra,y+Math.sin(a)*ra);ctx.quadraticCurveTo(x+Math.cos((a+b)/2)*100,y+Math.sin((a+b)/2)*100,x+Math.cos(b)*rb,y+Math.sin(b)*rb);ctx.stroke()}for(let i=0;i<8;i++){const a=i*Math.PI/4+seed%100/100;ctx.beginPath();ctx.arc(x+Math.cos(a)*270,y+Math.sin(a)*270,7,0,Math.PI*2);ctx.fillStyle='#e7c785';ctx.fill()}ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();notice('Your intention has a new sigil')}

loser to stronger systems, better clients, and larger success."}, {"title": "Private Jet Brotherhood Dinner", "src": "vision_board/13_private_jet_brotherhood_dinner.jpg", "affirmation": "I share success, celebration, travel, and unforgettable meals with the people in my circle. My prosperity creates experiences of luxury, brotherhood, loyalty, and ease, and I enjoy them with gratitude and confidence."}];
function favSigil(c,seed){if(!c)return;const ctx=c.getContext('2d');let a=0;for(const ch of seed)a=(Math.imul(a,31)+ch.charCodeAt(0))|0;let rng=()=>{a^=a<<13;a^=a>>>17;a^=a<<5;return(a>>>0)/4294967295};c.width=440;c.height=440;ctx.clearRect(0,0,440,440);ctx.translate(220,220);ctx.strokeStyle='#d7b46b';ctx.fillStyle='#d7b46b';ctx.lineWidth=2;for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(0,0,70+k*48,0,Math.PI*2);ctx.globalAlpha=.7;ctx.stroke()}const n=7+Math.floor(rng()*6),points=[];for(let i=0;i<n;i++){let t=-Math.PI/2+i*2*Math.PI/n,rad=90+rng()*75;points.push([Math.cos(t)*rad,Math.sin(t)*rad])}ctx.globalAlpha=.95;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<n;i++){let j=(i*3)%n;ctx[i===0?'moveTo':'lineTo'](...points[j])}ctx.closePath();ctx.stroke();ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.setTransform(1,0,0,1,0,0)}
function renderFavorites(){let e=document.getElementById('pg_favorites');if(!e)return;e.innerHTML=`${sectionTitle('CURATED VISUALIZATION GALLERY','Vision Board','These selected images are installed directly into your Grimoire. Each vision includes a detailed present-tense affirmation and a compact sigil so the picture, words, and symbol live together on the same page.')}<div class="card"><h3>Installed visions</h3><p class="vision-note">Thirteen unique vision images are included here. Duplicate images were removed. Use each card for quick visualization, or open a focused 60-second mode.</p><div class="vision-toolbar"><button id="visionStartAll">Open first focus view</button><button id="visionExportList">Copy all affirmations</button></div></div><div class="fav-grid" id="favGrid"></div><div class="fav-overlay" id="favOverlay"><div class="fav-focus"><h2 id="favFocusTitle">Focused Vision</h2><img id="favFocusImage" alt="Selected vision"><canvas id="favFocusSigil"></canvas><p id="favFocusWords"></p><p id="favFocusClock">01:00</p><button id="favFocusStart">Start 60-second focus</button><button id="favFocusClose">Close</button></div></div>`;document.getElementById('visionStartAll').onclick=()=>favShow(VISION_BOARD_ITEMS[0]);document.getElementById('visionExportList').onclick=()=>{const words=VISION_BOARD_ITEMS.map((x,i)=>`${i+1}. ${x.title}\n${x.affirmation}`).join('\n\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(words).then(()=>notice('All vision affirmations copied')).catch(()=>alert(words))}else{alert(words)}};favPaint();document.getElementById('favFocusClose').onclick=()=>{document.getElementById('favOverlay').classList.remove('open');clearInterval(window.favFocusTimer)}}
function favPaint(){const grid=document.getElementById('favGrid');if(!grid)return;grid.innerHTML='';VISION_BOARD_ITEMS.forEach((rec)=>{let el=document.createElement('article');el.className='fav-item';el.innerHTML=`<img alt="Vision board image" src="${rec.src}"><div class="fav-body"><div class="vision-caption">Vision Board</div><h3>${esc(rec.title)}</h3><p class="vision-affirm">${esc(rec.affirmation)}</p><canvas></canvas><div class="row" style="justify-content:center"><button class="fav-view fav-btn">Visualize</button><button class="fav-copy fav-btn">Copy affirmation</button></div></div>`;grid.appendChild(el);favSigil(el.querySelector('canvas'),rec.title+'|'+rec.affirmation);el.querySelector('.fav-view').onclick=()=>favShow(rec);el.querySelector('.fav-copy').onclick=()=>navigator.clipboard?.writeText(rec.affirmation).then(()=>notice('Affirmation copied')).catch(()=>alert(rec.affirmation))})}
function favShow(rec){const overlay=document.getElementById('favOverlay');overlay.classList.add('open');document.getElementById('favFocusTitle').textContent=rec.title;document.getElementById('favFocusImage').src=rec.src;document.getElementById('favFocusWords').textContent=rec.affirmation;favSigil(document.getElementById('favFocusSigil'),rec.title+'|'+rec.affirmation);clearInterval(window.favFocusTimer);document.getElementById('favFocusClock').textContent='01:00';document.getElementById('favFocusStart').onclick=()=>{clearInterval(window.favFocusTimer);let t=60;window.favFocusTimer=setInterval(()=>{t--;document.getElementById('favFocusClock').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;if(!t)clearInterval(window.favFocusTimer)},1000)}}

function boot(){drawPages();for(let k of Object.keys(AFFIRM))chamber(k);renderSigils();renderBackup();go('home');const st=document.createElement('div');st.id='status';st.className='status';st.style.cssText='position:fixed;bottom:8px;right:12px;z-index:100;background:#15151b;border:1px solid #66523a;border-radius:8px;padding:4px 10px;pointer-events:none';document.body.appendChild(st);notice('✦ System ready')}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script></body></html>
