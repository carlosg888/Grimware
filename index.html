function copy(s){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>notice('Copied')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}function fallbackCopy(s){let t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy');notice('Copied')}catch(e){notice('Select and copy the text manually')}t.remove()}
function hash(s){let n=2166136261;for(let c of s)n=Math.imul(n^c.charCodeAt(0),16777619);return n>>>0}
function generateSigil(){const t=field('sigil_text')||'I direct my will with clarity';const canvas=document.getElementById('sigil_canvas'),ctx=canvas.getContext('2d');const w=canvas.width=900,h=canvas.height=900,x=w/2,y=h/2;let seed=hash(t);function r(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}ctx.fillStyle='#0b0d13';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#cba46b';ctx.lineWidth=3;for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x,y,335-j*37,0,Math.PI*2);ctx.stroke()}for(let i=0;i<13;i++){const a=r()*Math.PI*2,b=r()*Math.PI*2,ra=65+r()*230,rb=65+r()*230;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*ra,y+Math.sin(a)*ra);ctx.quadraticCurveTo(x+Math.cos((a+b)/2)*100,y+Math.sin((a+b)/2)*100,x+Math.cos(b)*rb,y+Math.sin(b)*rb);ctx.stroke()}for(let i=0;i<8;i++){const a=i*Math.PI/4+seed%100/100;ctx.beginPath();ctx.arc(x+Math.cos(a)*270,y+Math.sin(a)*270,7,0,Math.PI*2);ctx.fillStyle='#e7c785';ctx.fill()}ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();notice('Your intention has a new sigil')}

const GRIMWARE_GUIDES = {
 shadow: [
  "Welcome to Shadow Alchemy. Find a comfortable position and allow your shoulders to relax.",
  "Inhale gently for four counts. Exhale slowly for six. Let your attention settle.",

 ],
 empire: [

 ]

let grimwareSpeech = null;
function stopGrimwareSpeech(){
 if("speechSynthesis" in window) window.speechSynthesis.cancel();
 grimwareSpeech = null;
}
function speakGrimwareGuide(which, status){
 if(!("speechSynthesis" in window)){
  status.textContent="This browser does not support voice narration. Try Safari or Chrome.";
  return;
 }
 stopGrimwareSpeech();
 const lines = GRIMWARE_GUIDES[which];
 let index = 0;
 const session = {stopped:false};
 grimwareSpeech = session;
 const playNext = () => {
  if(grimwareSpeech !== session || session.stopped) return;
  if(index >= lines.length){
   status.textContent="Browser narration completed. This was a short fallback, not the original Anna recording.";
   grimwareSpeech=null;
   return;
  }
  const utterance = new SpeechSynthesisUtterance(lines[index++]);
  utterance.lang="en-US";
  utterance.rate=0.8;
  utterance.pitch=1;
  const voices=window.speechSynthesis.getVoices();
  utterance.voice=voices.find(v=>v.lang.startsWith("en") && /female|samantha|victoria|ava|allison|serena/i.test(v.name)) || voices.find(v=>v.lang.startsWith("en")) || null;
  utterance.onend=()=>{if(grimwareSpeech===session)playNext()};
  utterance.onerror=()=>{status.textContent="Narration was interrupted. Tap Listen again.";if(grimwareSpeech===session)grimwareSpeech=null};
  status.textContent="Playing browser-generated guided narration ("+index+"/"+lines.length+")";
  window.speechSynthesis.speak(utterance);
 };
 playNext();
}
function renderMeditations(){
 const el=document.getElementById("pg_meditations");
 const tracks=[
  {id:"shadow",name:"Shadow Alchemy",detail:"Recognition, release and integration.",file:"audio/shadow_alchemy_anna.mp3"},
  {id:"empire",name:"Brotherhood Empire",detail:"Partnership, ethical opportunities and business action.",file:"audio/brotherhood_empire_anna.mp3"}
 ];
 el.innerHTML=sectionTitle("GUIDED AUDIO SANCTUARY","The Anna Studio","Play the original recordings when available, or use browser voice narration if audio files have not yet been uploaded.")+
  '<div class="grid">'+tracks.map(t=>'<div class="player"><div class="eyebrow">GUIDED SESSION</div><h3>'+t.name+'</h3><p>'+t.detail+'</p><audio id="audio_'+t.id+'" controls preload="metadata" style="width:100%"></audio><p class="fine" id="status_'+t.id+'" role="status" aria-live="polite">Checking recording availability…</p><div class="row"><button id="play_'+t.id+'">▶ Play recording</button><button id="narrate_'+t.id+'">♫ Listen to guided narration</button><button id="stop_'+t.id+'">■ Stop voice</button><a id="download_'+t.id+'" href="'+t.file+'" download hidden>Download MP3</a></div></div>').join('')+'</div>'+
  '<div class="card"><h3>After your meditation</h3><p>Record your reflections or turn your vision into a concrete step.</p><div class="row"><button data-go="shadow">Open shadow work</button><button data-go="enterprise">Open business visualization</button></div></div>'+
  '<p class="fine">The original MP3s include Anna and their music/silence mix. Browser narration uses a different synthesized voice, a shorter script, and no music. Browser autoplay restrictions require you to tap a playback button.</p>';
 wireGo(el);
 tracks.forEach(t=>{
  const audio=el.querySelector("#audio_"+t.id);
  const status=el.querySelector("#status_"+t.id);
  const play=el.querySelector("#play_"+t.id);
  const download=el.querySelector("#download_"+t.id);
  const mediaUrl=new URL(t.file,document.baseURI);
  audio.src=mediaUrl.href;
  const markUnavailable=()=>{
   status.textContent="Original recording is not hosted here yet. Tap Listen to guided narration for the browser-voice alternative.";
   play.disabled=true;
   download.hidden=true;
  };
  audio.addEventListener("error",markUnavailable);
  audio.addEventListener("playing",()=>{
   status.textContent="Playing original Anna recording.";
   stopGrimwareSpeech();
  });
  play.addEventListener("click",()=>{
   stopGrimwareSpeech();
   tracks.forEach(other=>{if(other.id!==t.id)el.querySelector("#audio_"+other.id).pause()});
   audio.play().catch(()=>{
    markUnavailable();
    status.textContent="Recording could not be played. Use guided narration below or check your browser audio settings.";
   });
  });
  el.querySelector("#narrate_"+t.id).addEventListener("click",()=>{
   tracks.forEach(other=>el.querySelector("#audio_"+other.id).pause());
   speakGrimwareGuide(t.id,status);
  });
  el.querySelector("#stop_"+t.id).addEventListener("click",()=>{
   stopGrimwareSpeech();
   status.textContent="Browser narration stopped.";
  });
  fetch(mediaUrl.href,{method:"HEAD",cache:"no-store"}).then(response=>{
   if(!response.ok)throw Error("HTTP "+response.status);
   play.disabled=false;
   download.hidden=false;
   status.textContent="Original recording available. Press Play recording.";
  }).catch(markUnavailable);
 });
}

wireGo(el);el.querySelector('#add_entry').addEventListener('click',()=>{if(!field('entry_title')&&!field('entry_body')){el.querySelector('#entry_status').textContent='Enter a title or note first';return}db[k].push({title:field('entry_title')||'Untitled',body:field('entry_body'),date:dateNow(),type:k});save();renderRecords(k)});el.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Delete this saved entry?')){db[k].splice(+b.dataset.delete,1);save();renderRecords(k)}}))}
function renderSigils(){let el=document.getElementById('pg_sigils');el.innerHTML=sectionTitle('SYMBOLIC ATELIER','Sigil Generator','Convert any written intention into a repeatable geometric seal, then save the image locally.')+`<div class="card"><label>Your present-tense intention<textarea id="sigil_text">I recognize opportunities and act with confidence.</textarea></label><div class="row"><button id="make_sigil">◇ Generate sigil</button><button id="download_sigil">↓ Export PNG</button></div><canvas class="sigil" id="sigil_canvas" width="900" height="900"></canvas><p class="fine">This sigil is generated deterministically from your written intention; the same exact text produces the same pattern.</p></div>`;el.querySelector('#make_sigil').onclick=generateSigil;el.querySelector('#download_sigil').onclick=()=>{let a=document.createElement('a');a.download='Cyber_Grimoire_Sigil.png';a.href=el.querySelector('canvas').toDataURL('image/png');a.click()};generateSigil()}
